<!-- Gmail email signature for Tinashe @ Origami EV Connect — installed only
     on the hello@origamievconnect.com alias under origamiconsultinggroup@gmail.com.

     Brand tokens (from the OEVC proposal handoff):
       ink #0B1220 / ink-2 #1E293B / muted #475569 / line #E2E8F0
       green #10B981 / green-2 #34D399 / teal #087CA7
       fonts: DM Sans (body), Fraunces (display), DM Mono (overline / metadata)
       gradient: linear-gradient(90deg, #10B981, #087CA7) — the brand pill.

     Layout notes for any future agent picking this up:
     - The wordmark logo (the green-to-teal gradient pill containing
       "ORIGAMI EV CONNECT" with the leaf "C") is loaded from the canonical
       brand asset at origamievconnect.com/logo.svg, which is publicly
       served. We initially used a synthesized compact mark hosted on
       origami-digital.co.za; that was removed once we got the real logo URL.
     - Inline <svg> gets stripped by Gmail's signature sanitiser, so the
       wordmark must be loaded as <img>, not embedded.
     - CSS gradients on <td> backgrounds are unreliable across Outlook and
       Apple Mail, so the green→teal accent at the bottom is approximated
       with three colour-stop spans.
     - DM Sans / Fraunces / DM Mono aren't pre-installed everywhere; the
       system fallbacks cover Apple Mail (SF Pro), Outlook (Segoe UI), and
       Gmail web (Helvetica). The signature still reads correctly without them.
-->
